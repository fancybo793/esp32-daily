name: debug-models

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 目录接口
        run: |
          echo "--- catalog"
          curl -s -o /tmp/cat.json -w "status=%{http_code}\n" https://models.github.ai/catalog/models
          head -c 300 /tmp/cat.json; echo

      - name: 推理接口（带响应头）
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- inference"
          curl -s -i -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $T" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"reply with the single word: pong"}],"max_tokens":10}' \
            | head -40
