name: debug-net

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测可用文本服务
        run: |
          echo "=== pollinations 简单 GET"
          curl -s -i --max-time 30 "https://text.pollinations.ai/hello" | head -8

          echo "=== google translate (gtx)"
          curl -s --max-time 30 "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=A%20cheap%20ESP32%20board%20that%20reads%20your%20electricity%20meter" | head -c 400; echo

          echo "=== mymemory"
          curl -s --max-time 30 "https://api.mymemory.translated.net/get?q=sensors%20and%20a%20small%20model&langpair=en%7Czh-CN" | head -c 400; echo
